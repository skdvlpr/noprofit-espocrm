name: Prod provision after deploy (oneshot)

# Explicit operator-triggered post-deploy: Installer (tabs/roles/shift planning),
# prune orphan VolunteerActivityDispatch trees, rebuild, send Account export email.
# Approved by user request 2026-08-04 (deploy + migrations + Proton test mail).

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_SSH_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run Installer + prune VAD + send Account export
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -p "${DEPLOY_SSH_PORT:-22}" -i ~/.ssh/deploy_key \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "DEPLOY_PATH='${DEPLOY_PATH}' bash -se" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f data/config.php

          echo "== Prune orphan VolunteerActivityDispatch (merged into NonprofitEspocrm) =="
          rm -rf custom/Espo/Modules/VolunteerActivityDispatch \
                 client/custom/modules/volunteer-activity-dispatch \
                 || true

          echo "== Installer::runPostInstall (tabs, roles, shift planning) =="
          php -r '
          require "bootstrap.php";
          use Espo\Core\Application;
          use Espo\Modules\NonprofitEspocrm\Tools\Installer;
          $app = new Application();
          $app->setupSystemUser();
          (new Installer())->runPostInstall($app->getContainer());
          echo "Installer OK\n";
          '

          echo "== Knowledge Base guides upsert (it_IT) =="
          php -r '
          require "bootstrap.php";
          use Espo\Core\Application;
          use Espo\Core\InjectableFactory;
          use Espo\Modules\NonprofitEspocrm\Tools\KnowledgeBaseGuidesSeeder;
          $app = new Application();
          $app->setupSystemUser();
          $result = $app->getContainer()->getByClass(InjectableFactory::class)
              ->create(KnowledgeBaseGuidesSeeder::class)->run();
          echo "KB created=" . count($result["created"]) . " updated=" . count($result["updated"]) . "\n";
          foreach (array_merge($result["created"], $result["updated"]) as $n) {
              echo " - $n\n";
          }
          '

          echo "== BugTracker Installer (tab, ACL, templates) =="
          php -r '
          require "bootstrap.php";
          use Espo\Core\Application;
          use Espo\Modules\BugTracker\Tools\Installer as BugTrackerInstaller;
          $app = new Application();
          $app->setupSystemUser();
          if (!class_exists(BugTrackerInstaller::class)) {
              fwrite(STDERR, "BugTracker Installer missing — module not deployed?\n");
              exit(1);
          }
          (new BugTrackerInstaller())->runPostInstall($app->getContainer());
          echo "BugTracker Installer OK\n";
          '

          echo "== Prod bin hygiene (list + quarantine maintenance leftovers) =="
          mkdir -p bin/_quarantine
          if [[ -d bin ]]; then
            ls -la bin || true
            shopt -s nullglob
            for f in bin/smoke-*.php bin/seed-*.php bin/migrate-*.php bin/test-*.php \
                     bin/cleanup-*.php bin/provision-*.php bin/setup-*.php \
                     bin/import-*.php bin/export-*.php bin/qa-*.php bin/print-*.php \
                     bin/_tmp-*.php; do
              base=$(basename "$f")
              echo "Quarantine $f"
              mv -f "$f" "bin/_quarantine/$base" || true
            done
            shopt -u nullglob
            if [[ ! -f bin/README.PRODUCTION.txt ]]; then
              printf '%s\n' "See repo bin/README.PRODUCTION.txt — no smoke/seed/migrate CLIs on production." > bin/README.PRODUCTION.txt
            fi
            echo "Remaining bin PHP:"
            ls -la bin/*.php bin/lib 2>/dev/null || true
            echo "Quarantine:"
            ls -la bin/_quarantine 2>/dev/null || true
          fi

          echo "== Security snapshot (read-only) =="
          php -r '
          require "bootstrap.php";
          use Espo\Core\Application;
          use Espo\Core\Utils\Config;
          use Espo\Core\Utils\Metadata;
          $app = new Application();
          $app->setupSystemUser();
          $c = $app->getContainer();
          $config = $c->getByClass(Config::class);
          $meta = $c->getByClass(Metadata::class);
          $meta->init(true);
          echo "siteUrl=" . $config->get("siteUrl") . "\n";
          echo "theme=" . $config->get("theme") . "\n";
          echo "bugTrackerEnabled=" . json_encode($config->get("bugTrackerEnabled")) . "\n";
          echo "BugReport.scope.entity=" . json_encode($meta->get(["scopes","BugReport","entity"])) . "\n";
          echo "ActivityOffer.scope.entity=" . json_encode($meta->get(["scopes","ActivityOffer","entity"])) . "\n";
          $tab = $config->get("tabList") ?? [];
          $hasBug = false;
          $walk = function ($list) use (&$walk, &$hasBug) {
              foreach ((array)$list as $item) {
                  if ($item === "BugReport") { $hasBug = true; return; }
                  if (is_object($item) && isset($item->itemList)) $walk($item->itemList);
                  if (is_array($item) && isset($item["itemList"])) $walk($item["itemList"]);
              }
          };
          $walk($tab);
          echo "tabList.hasBugReport=" . ($hasBug ? "1" : "0") . "\n";
          echo "outboundEmailFromAddress=" . json_encode($config->get("outboundEmailFromAddress")) . "\n";
          '

          echo "== Rebuild =="
          php command.php rebuild

          echo "== Done =="
          REMOTE
